<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111">
<title>Time-lapse 24</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#111;color:#fff;min-height:100vh;display:flex;flex-direction:column}
header{padding:14px 16px;text-align:center;font-weight:700}
main{width:min(900px,100%);margin:auto;padding:0 12px 24px}
.preview{position:relative;background:#000;border-radius:14px;overflow:hidden}
video{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;transform:scaleX(-1)}
#status{position:absolute;left:10px;top:10px;background:#000b;border-radius:20px;padding:6px 10px;font-size:13px}
.panel{background:#1c1c1e;border-radius:14px;padding:14px;margin-top:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
label{font-size:15px}
input,select,button{font:inherit}
input[type=number],select{background:#2c2c2e;color:#fff;border:1px solid #555;border-radius:9px;padding:9px}
input[type=number]{width:90px}
button{border:0;border-radius:10px;padding:12px 16px;font-weight:700;background:#0a84ff;color:white}
button.secondary{background:#3a3a3c}
button.danger{background:#ff453a}
button:disabled{opacity:.45}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:#2c2c2e;border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px}
.small{font-size:13px;color:#aaa;line-height:1.4}
#save{display:none;margin-top:10px;width:100%}
#message{margin-top:10px;line-height:1.4}
</style>
</head>
<body>
<header>Time-lapse 24 i/s</header>
<main>
  <div class="preview">
    <video id="preview" autoplay muted playsinline></video>
    <div id="status">Caméra inactive</div>
  </div>

  <div class="panel">
    <div class="row">
      <label for="interval">Une image toutes les</label>
      <input id="interval" type="number" min="1" max="60" value="10">
      <select id="unit">
        <option value="s">secondes</option>
        <option value="m">minutes</option>
      </select>
    </div>

    <div class="row" style="margin-top:12px">
      <button id="start">Démarrer</button>
      <button id="stop" class="danger" disabled>Arrêter</button>
      <button id="camera" class="secondary">Activer la caméra</button>
    </div>

    <div class="stats">
      <div class="stat"><b id="frames">0</b><span class="small">images prises</span></div>
      <div class="stat"><b id="duration">00:00:00</b><span class="small">durée vidéo</span></div>
      <div class="stat"><b id="elapsed">00:00:00</b><span class="small">temps réel</span></div>
    </div>

    <div id="message" class="small">
      Cadrez d'abord. La vidéo est construite image par image à 24 images/s ; les photos individuelles ne sont pas enregistrées.
    </div>
    <button id="save">Enregistrer / partager la vidéo</button>
  </div>
</main>

<script type="module">
import { Muxer, ArrayBufferTarget } from "https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.2/build/mp4-muxer.mjs";

const video = document.getElementById("preview");
const intervalEl = document.getElementById("interval");
const unitEl = document.getElementById("unit");
const startBtn = document.getElementById("start");
const stopBtn = document.getElementById("stop");
const cameraBtn = document.getElementById("camera");
const saveBtn = document.getElementById("save");
const statusEl = document.getElementById("status");
const message = document.getElementById("message");
const framesEl = document.getElementById("frames");
const durationEl = document.getElementById("duration");
const elapsedEl = document.getElementById("elapsed");

let stream = null;
let encoder = null;
let muxer = null;
let running = false;
let timer = null;
let startedAt = 0;
let frameCount = 0;
let lastError = null;
const FPS = 24;

function fmt(sec){
  sec = Math.floor(sec);
  const h = String(Math.floor(sec/3600)).padStart(2,"0");
  const m = String(Math.floor(sec%3600/60)).padStart(2,"0");
  const s = String(sec%60).padStart(2,"0");
  return `${h}:${m}:${s}`;
}
function intervalMs(){
  return Number(intervalEl.value) * (unitEl.value === "m" ? 60000 : 1000);
}
function updateStats(){
  durationEl.textContent = fmt(frameCount / FPS);
  if(startedAt) elapsedEl.textContent = fmt((Date.now()-startedAt)/1000);
}
async function startCamera(){
  if(stream) return;
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}},
      audio:false
    });
    video.srcObject = stream;
    await video.play();
    statusEl.textContent = "Caméra active";
    cameraBtn.textContent = "Caméra activée";
    cameraBtn.disabled = true;
  }catch(e){
    message.textContent = "Impossible d'accéder à la caméra. Vérifiez l'autorisation Safari et utilisez l'application en HTTPS.";
    statusEl.textContent = "Erreur caméra";
    console.error(e);
  }
}
function setRunningUI(on){
  running=on;
  startBtn.disabled=on;
  stopBtn.disabled=!on;
  intervalEl.disabled=on;
  unitEl.disabled=on;
  cameraBtn.disabled=on || !!stream;
  statusEl.textContent=on ? "ENREGISTREMENT" : (stream ? "Caméra active" : "Caméra inactive");
}
async function start(){
  if(!stream) await startCamera();
  if(!stream) return;

  saveBtn.style.display="none";
  frameCount=0; framesEl.textContent="0"; durationEl.textContent="00:00:00";
  lastError=null;
  const w=video.videoWidth, h=video.videoHeight;
  if(!w || !h){ message.textContent="La caméra n'est pas encore prête."; return; }

  if(!("VideoEncoder" in window)){
    message.textContent="Ce navigateur ne dispose pas de WebCodecs VideoEncoder : cette version de l'application ne peut pas fabriquer le time-lapse.";
    return;
  }

  const codecCandidates=["avc1.4d0028","avc1.4d401f","avc1.420028"];
  let chosen=null;
  for(const codec of codecCandidates){
    try{
      const c=await VideoEncoder.isConfigSupported({codec,width:w,height:h,framerate:FPS,bitrate:8_000_000}).then(x=>x.config);
      if(c){ chosen=c; break; }
    }catch(_){}
  }
  if(!chosen){
    message.textContent="L'encodage H.264 n'est pas disponible sur cet iPad/navigateur.";
    return;
  }

  const target=new ArrayBufferTarget();
  muxer=new Muxer({
    target,
    video:{codec:"avc",width:w,height:h},
    fastStart:"in-memory"
  });

  encoder=new VideoEncoder({
    output:(chunk,meta)=>muxer.addVideoChunk(chunk,meta),
    error:e=>{lastError=e; console.error(e); message.textContent="Erreur d'encodage : "+e.message;}
  });
  encoder.configure({...chosen, bitrate:8_000_000, framerate:FPS});

  setRunningUI(true);
  startedAt=Date.now();
  message.textContent="Enregistrement en cours. Gardez l'iPad branché et ne fermez pas cette page.";
  await captureFrame();

  const ms=intervalMs();
  timer=setInterval(captureFrame,ms);
  const uiTimer=setInterval(()=>{ if(!running) clearInterval(uiTimer); updateStats(); },1000);
}
async function captureFrame(){
  if(!running || !encoder || encoder.state!=="configured") return;
  try{
    const vf=new VideoFrame(video,{timestamp:Math.round(frameCount*1_000_000/FPS)});
    encoder.encode(vf,{keyFrame:frameCount===0 || frameCount%48===0});
    vf.close();
    frameCount++;
    framesEl.textContent=String(frameCount);
    durationEl.textContent=fmt(frameCount/FPS);
  }catch(e){
    lastError=e;
    console.error(e);
    message.textContent="Erreur pendant la capture : "+e.message;
    await stop();
  }
}
async function stop(){
  if(!running) return;
  running=false;
  clearInterval(timer); timer=null;
  startBtn.disabled=true; stopBtn.disabled=true;
  statusEl.textContent="Finalisation…";
  message.textContent="Finalisation de la vidéo…";
  try{
    if(encoder){
      await encoder.flush();
      encoder.close();
      encoder=null;
    }
    if(muxer){
      muxer.finalize();
      const buffer=muxer.target.buffer;
      muxer=null;
      const blob=new Blob([buffer],{type:"video/mp4"});
      const file=new File([blob],"timelapse-24fps.mp4",{type:"video/mp4"});
      saveBtn.style.display="block";
      saveBtn.onclick=async()=>{
        if(navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){
          try{ await navigator.share({files:[file],title:"Time-lapse"}); return; }catch(e){}
        }
        const url=URL.createObjectURL(blob);
        const a=document.createElement("a"); a.href=url; a.download=file.name; a.click();
        setTimeout(()=>URL.revokeObjectURL(url),60000);
      };
      message.textContent="Vidéo prête. Sur iPad, le bouton ci-dessous ouvre le menu de partage, qui permet notamment de l'enregistrer dans Photos.";
    }
  }catch(e){
    console.error(e);
    message.textContent="Impossible de finaliser la vidéo : "+e.message;
  }finally{
    startBtn.disabled=false;
    stopBtn.disabled=true;
    intervalEl.disabled=false; unitEl.disabled=false;
    cameraBtn.disabled=!!stream;
    statusEl.textContent=stream ? "Caméra active" : "Caméra inactive";
  }
}

cameraBtn.onclick=startCamera;
startBtn.onclick=start;
stopBtn.onclick=stop;

window.addEventListener("pagehide",()=>{
  if(stream) stream.getTracks().forEach(t=>t.stop());
});
</script>
</body>
</html>
